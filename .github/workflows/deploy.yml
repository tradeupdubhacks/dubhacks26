name: Deploy to Vultr

on:
  push:
    branches: [balls]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run deploy.sh on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # the server's host key, so the job only talks to our box
          echo "45.32.219.66 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDc/T8hi+kXl/v8+dsGbIOl3irSUUQ70J+kuOOWiMKHn" > ~/.ssh/known_hosts
          # the key is locked to deploy.sh in authorized_keys, so no remote command is given
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@45.32.219.66
